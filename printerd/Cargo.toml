[package]
name = "printerd"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "print-agent"
path = "src/main.rs"

[dependencies]
anyhow = "1"
capnp = "0.25"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
ipp = { version = "7", default-features = false, features = ["async-client"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["compat"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
webpki-roots = "0.26"

[build-dependencies]
capnpc = "0.25"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
